<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>brand generator (build-time only)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070B14}
  .stage{position:fixed;inset:0;background:#070B14;
    background-image:radial-gradient(120% 90% at 50% 0%, #10B98112, transparent 70%);
    display:flex;align-items:center;justify-content:center}
  .rings{position:relative;display:flex;align-items:center;justify-content:center}
  .rings svg{width:100%;height:100%;display:block}

  /* icon mode: rings fill the canvas */
  .stage[data-mode="icon"] .rings{width:66vmin;height:66vmin}
  /* maskable: keep content inside the 80% safe zone */
  .stage[data-mode="maskable"] .rings{width:58vmin;height:58vmin}

  /* splash mode */
  .stage[data-mode="splash"],.stage[data-mode="splash-dark"]{flex-direction:column;gap:4.2vmin}
  .stage[data-mode="splash"] .rings{width:17vmin;height:17vmin}
  .wordmark{font-family:'DM Sans',system-ui,sans-serif;font-weight:600;color:#EAEEF5;
    font-size:min(7.4vmin,42px);letter-spacing:-.02em;line-height:1}
  .caption{font-family:'DM Sans',system-ui,sans-serif;font-weight:500;color:#5F6980;
    font-size:min(3.2vmin,15px);letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="rings">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="9" stroke="#10B981" stroke-width="2.2" opacity=".32"/>
      <circle cx="12" cy="12" r="5" stroke="#10B981" stroke-width="2.2" opacity=".58"/>
      <circle cx="12" cy="12" r="1.75" fill="#34D399"/>
    </svg>
  </div>
  <div id="text-col" style="display:none;flex-direction:column;align-items:center;gap:1.6vmin">
    <div class="wordmark">ProxiWake</div>
    <div class="caption">Never miss your stop</div>
  </div>
</div>
<script>
  const p=new URLSearchParams(location.search);
  const mode=p.get('type')||'icon';
  const stage=document.getElementById('stage');
  stage.dataset.mode=mode;
  if(mode.startsWith('splash')) document.getElementById('text-col').style.display='flex';
</script>
</body>
</html>
